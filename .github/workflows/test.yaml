name: SDK tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: src/__tests__/mockserver/go.sum
      - run: npm ci
      - run: npm run lint
      - run: npm test
